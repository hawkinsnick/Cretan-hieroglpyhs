name: validate
on: [push, pull_request]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate_release.py
      - run: python scripts/test_current_state.py
      - run: python scripts/build_release_manifest.py > /tmp/release-manifest.json

      - run: python scripts/validate_primary_pilot.py
      - run: python scripts/test_primary_pilot.py
